name: Compatibility tap checks

on:
  push:
    branches: [main]
    paths:
      - Casks/**
      - .github/workflows/cask.yml
  pull_request:
    paths:
      - Casks/**
      - .github/workflows/cask.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Homebrew
        run: |
          test "$(uname -m)" = arm64
          brew update
          brew tap usamabinshahid97/cmf-companion "$GITHUB_WORKSPACE"
      - name: Compare with canonical cask
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/usamabinshahid97/homebrew-tap/main/Casks/cmf-companion.rb -o "$RUNNER_TEMP/canonical-cask.rb"
          cmp Casks/cmf-companion.rb "$RUNNER_TEMP/canonical-cask.rb"
      - name: Install compatibility cask, verify, and uninstall
        run: |
          mkdir -p "$RUNNER_TEMP/cmf-apps"
          brew install --yes --cask --appdir="$RUNNER_TEMP/cmf-apps" usamabinshahid97/cmf-companion/cmf-companion
          brew info --json=v2 --cask cmf-companion | python3 -c 'import json,sys; assert json.load(sys.stdin)["casks"][0]["tap"] == "usamabinshahid97/cmf-companion"'
          codesign --verify --deep --strict "$RUNNER_TEMP/cmf-apps/CMF Companion.app"
          xattr -p com.apple.quarantine "$RUNNER_TEMP/cmf-apps/CMF Companion.app"
          brew uninstall --cask cmf-companion
          test ! -e "$RUNNER_TEMP/cmf-apps/CMF Companion.app"
